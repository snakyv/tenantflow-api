services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: tenantflow
      POSTGRES_USER: tenantflow
      POSTGRES_PASSWORD: tenantflow
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantflow -d tenantflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-tenantflow}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-tenantflow-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "1025:1025"
      - "8025:8025"

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres_data:
  redis_data:
  minio_data:
