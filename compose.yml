x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+asyncpg://tenantflow:tenantflow@postgres:5432/tenantflow
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: http://minio:9000
  MINIO_PUBLIC_ENDPOINT: http://localhost:9000
  MAIL_HOST: mailpit
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

x-app-base: &app-base
  build: .
  env_file: .env
  environment:
    <<: *app-environment

services:
  migrate:
    <<: *app-base
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  storage-init:
    <<: *app-base
    command: ["python", "scripts/init_minio.py"]
    restart: "no"
    depends_on:
      minio:
        condition: service_started

  api:
    <<: *app-base
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  worker:
    <<: *app-base
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  beat:
    <<: *app-base
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: tenantflow
      POSTGRES_USER: tenantflow
      POSTGRES_PASSWORD: tenantflow
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenantflow -d tenantflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-tenantflow}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-tenantflow-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "8025:8025"

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  prometheus:
    image: prom/prometheus:v3.13.2
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
