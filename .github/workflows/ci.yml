name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: tenantflow_test
          POSTGRES_USER: tenantflow
          POSTGRES_PASSWORD: tenantflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenantflow -d tenantflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8.10.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://tenantflow:tenantflow@localhost:5432/tenantflow_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-that-is-at-least-32-characters
      WEBHOOK_ENCRYPTION_KEY: ci-only-webhook-encryption-key-32-characters
      RUN_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Start MinIO and Mailpit
        run: |
          docker compose -f compose.dev.yml up -d minio mailpit
          python scripts/init_minio.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy app tests
      - name: Apply migrations
        run: alembic upgrade head
      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - name: Dependency audit
        run: pip-audit
      - name: Build image
        run: docker build -t tenantflow-api:ci .
      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage.xml
          path: coverage.xml
      - name: Stop support containers
        if: always()
        run: docker compose -f compose.dev.yml down -v
